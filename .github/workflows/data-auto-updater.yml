name: Data Auto Updater

on:
  # Only to refresh the wiki snapshot. A parser change arrives with the data/
  # it builds from the committed snapshot (PR Checks enforces it), so pushes
  # have nothing to regenerate.
  schedule:
    # Run at 5:18 UTC daily
    - cron: '18 5 * * *'
  # Manual runs, on master or any branch. A run on another branch is a
  # preview: it regenerates the data from the current wiki and uploads it
  # with a diff as an artifact, but never commits and never posts to
  # Discord, so scraper changes can be checked against pages newer than
  # the committed snapshot before they merge.
  workflow_dispatch:

jobs:
  build-data:
    runs-on: ubuntu-latest
    env:
      IS_MASTER: ${{ github.ref == 'refs/heads/master' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTO_UPDATER_REPO_ACCESS_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-builder/requirements.txt

      - name: Install Playwright browser runtime
        run: |
          python -m playwright install chromium

      # Off master, build.py writes a preview to data-preview/ and skips
      # Discord; the Commit step below is master-only too. The checkout
      # already holds the committed snapshot, and a page already on disk
      # isn't downloaded again, so start from an empty one. build.py posts
      # to Discord only when it fails or makes the data worse.
      - name: Run script
        id: build
        env:
          DISCORD_HOOK: ${{ secrets.AUTO_UPDATER_DISCORD_HOOK }}
          PREVIEW_ARGS: ${{ env.IS_MASTER != 'true' && '--preview-dir data-preview' || '' }}
        run: python data-builder/build.py --clear-snapshot --discord "$DISCORD_HOOK" $PREVIEW_ARGS

      - name: Check for substantive data changes
        id: data-changes
        shell: bash
        run: |
          changes=$(git status --porcelain data data-builder/source_packs.json \
            | grep -v 'data/build-info.json' || true)

          if [ -n "$changes" ]; then
            echo "Data changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only build-info.json changed (or nothing changed)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Only a branch run writes a preview. It is published before the site
      # build and tests, and even when build.py aborted after writing it, so
      # it is there to inspect when the new data is what broke something.
      - name: Show data preview summary
        if: ${{ !cancelled() && hashFiles('data-preview/summary.md') != '' }}
        run: cat data-preview/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data preview
        if: ${{ !cancelled() && hashFiles('data-preview/summary.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: data-preview
          path: data-preview/

      # The site type-checks the generated JSON against game-data-types.ts, so
      # build it before committing: data the site can't compile against fails
      # this job instead of landing on master and breaking the next deploy.
      - name: Setup Node
        if: steps.data-changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site against new data
        if: steps.data-changes.outputs.changed == 'true'
        working-directory: site
        run: |
          npm ci
          npm run build

      # Data that compiles can still break behaviour the specs pin. Same
      # pass criteria as PR Checks: exit code, plus no ERROR lines or worker
      # crashes in the log.
      - name: Test site against new data
        if: steps.data-changes.outputs.changed == 'true'
        working-directory: site
        shell: bash
        run: |
          set -o pipefail
          npx ng test --watch=false 2>&1 | tee test.log
          if grep -nE 'ERROR|JavaScript heap out of memory|Worker forks emitted error' test.log; then
            echo "::error::Test log contains ERROR lines or a worker crash (see above)."
            exit 1
          fi

      - name: Commit
        if: steps.data-changes.outputs.changed == 'true' && env.IS_MASTER == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[auto-update] Latest data"
          commit_user_name: Data Auto Updater
          # The snapshot lands in the same commit as the data built from it.
          # It is committed only alongside a data change: a refresh that
          # changes no data leaves the committed snapshot, which still
          # reproduces the committed data. A build also scrapes newly listed
          # crafting devices into source_packs.json.
          file_pattern: data/*.json wiki-snapshot data-builder/source_packs.json

      # Discord hears only about problems. build.py reports its own
      # failures; this covers every other step, such as the site failing to
      # build or test against the new data.
      - name: Report failure to Discord
        if: failure() && env.IS_MASTER == 'true' && steps.build.outcome != 'failure'
        env:
          DISCORD_HOOK: ${{ secrets.AUTO_UPDATER_DISCORD_HOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_HOOK" ] || exit 0
          jq -n --arg content "**Data Auto Updater failed** - nothing was committed.
          <$RUN_URL>" '{content: $content}' \
            | curl -sS -H 'Content-Type: application/json' -d @- "$DISCORD_HOOK"

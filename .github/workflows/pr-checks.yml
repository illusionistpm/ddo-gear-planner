name: PR Checks

# The local gate from CLAUDE.md, run on every PR and on every push to master
# (which includes the Data Auto Updater's commits).
on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # A passing exit code isn't enough: an ERROR line means an async callback
      # outlived its TestBed, and a worker heap crash means a file's later specs
      # silently never ran. Both are red per CLAUDE.md.
      - name: Test
        run: |
          set -o pipefail
          npx ng test --watch=false 2>&1 | tee test.log
          if grep -nE 'ERROR|JavaScript heap out of memory|Worker forks emitted error' test.log; then
            echo "::error::Test log contains ERROR lines or a worker crash (see above)."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Build admin
        run: npm run admin:build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  data-builder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: data-builder/requirements.txt

      - run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest

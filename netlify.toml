[build]
  base = "site"
  command = "ng build --configuration production"
  # Runs from `base`. Exit 0 skips the build, so this skips only when nothing
  # the site is built from changed: site/ itself, data/ (the generated game
  # data, imported via @data/*) and shared/ (constants.json).
  # A build without cache - the first of a new deploy-preview branch - gets
  # CACHED_COMMIT_REF equal to COMMIT_REF, so the diff is empty; the guard
  # makes that build instead of skipping it.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../data ../shared"

[[redirects]]
  from = "https://ddo-gear-planner.netlify.app/*"
  to = "https://ddo-gear-planner.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

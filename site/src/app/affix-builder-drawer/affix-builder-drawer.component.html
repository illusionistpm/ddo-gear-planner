@if (drawer.isOpen$ | async) {
  <button type="button" class="affix-builder-backdrop" aria-label="Close affix builder" (click)="close()"></button>

  <aside class="affix-builder-drawer" aria-label="Edit tracked affixes" role="dialog" aria-modal="true">
    <header class="affix-builder-drawer-header">
      <h2>Edit tracked affixes</h2>
      <button type="button" class="affix-builder-drawer-close" aria-label="Close" title="Close" (click)="close()">
        <span aria-hidden="true">&times;</span>
      </button>
    </header>

    <div class="affix-builder-drawer-body">
      <app-affix-picker></app-affix-picker>
    </div>

    <!-- A full-width way out at the bottom: on a phone the corner x is a
         small target at the far end of the screen from the thumb. -->
    <footer class="affix-builder-drawer-foot">
      <span class="affix-builder-drawer-count">
        {{trackedCount}} affix{{trackedCount === 1 ? '' : 'es'}} selected
      </span>
      <button type="button" class="affix-builder-drawer-done" (click)="close()">Done</button>
    </footer>
  </aside>
}

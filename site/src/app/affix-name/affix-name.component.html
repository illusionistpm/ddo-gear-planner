@if (details) {
  <!-- title="": the row's own [title] is its rank tooltip, which would otherwise show over the details. -->
  <button #trigger type="button" class="affix-name-trigger" title=""
      [attr.aria-expanded]="usesPopover ? null : panelOpen"
      [ngbPopover]="usesPopover ? content : null" triggers="manual" container="body"
      popoverClass="affix-details-popover" placement="bottom-start top-start bottom top"
      (hidden)="onPopoverHidden()"
      (mouseenter)="onPointerEnter()" (mouseleave)="onPointerLeave()" (click)="onClick($event)">{{name}}</button>
} @else {{{name}}}

<ng-template #detailsContent let-heading="heading">
  @if (details; as details) {
    <app-affix-details [details]="details" [heading]="heading"
        (mouseenter)="hover.keepOpen()" (mouseleave)="onPointerLeave()" />
  }
</ng-template>

<section class="affix-start-banner onboarding-instruction-panel" aria-label="Pick a focus to get started">
  <p>
    <strong>New here?</strong>
    @if (defaultSelected) {
      Basic defenses are on - pick your build's focus to get gear suggestions.
    } @else {
      Choose the affixes your build needs to get gear suggestions.
    }
  </p>
  <button type="button" class="onboarding-action-button affix-start-choose" (click)="chooseAffixes()">
    <span class="fas fa-plus" aria-hidden="true"></span> Choose affixes
  </button>
</section>

<section class="affix-start-banner onboarding-instruction-panel" aria-label="Pick a focus to get started">
  <p>
    <strong>New here?</strong>
    @if (defaultSelected) {
      Basic defenses are on - pick your build's focus to get gear suggestions.
    } @else {
      Choose your build goals to get gear suggestions.
    }
  </p>
  <div class="affix-start-actions">
    <button type="button" class="onboarding-action-button affix-start-guided" (click)="startGuided()">
      <span class="fas fa-wand-magic-sparkles" aria-hidden="true"></span> Guided setup
    </button>
    <button type="button" class="onboarding-action-button affix-start-choose" (click)="chooseAffixes()">
      <span class="fas fa-bullseye" aria-hidden="true"></span> Choose build goals
    </button>
  </div>
</section>

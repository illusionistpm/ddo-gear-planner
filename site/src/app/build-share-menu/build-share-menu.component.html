<div class="share-menu">
  <button type="button" class="share-menu-item" [disabled]="shareLink.status !== 'ready'" (click)="copyLink()">{{ justCopied === 'link' ? 'Copied!' : shareLinkLabel }}</button>
  <button type="button" class="share-menu-item" [disabled]="shareLink.status !== 'ready'" (click)="copyTextAndLink()">{{ justCopied === 'text-link' ? 'Copied!' : shareTextAndLinkLabel }}</button>
  <button type="button" class="share-menu-item" (click)="copyTextOnly()">{{ justCopied === 'text' ? 'Copied!' : 'Copy text only' }}</button>
  @if (shareLink.status === 'error') {
    <span class="share-menu-error" role="alert">{{ shareLink.message }}</span>
  }
  @if (shareCopyError) {
    <span class="share-menu-error" role="alert">{{ shareCopyError }}</span>
  }
  @if (!isAuthenticated) {
    <button type="button" class="share-menu-hint" (click)="signIn()">Sign in for a short link</button>
  }
</div>
<button type="button" class="share-menu-backdrop" aria-label="Close share menu" (click)="closed.emit()"></button>

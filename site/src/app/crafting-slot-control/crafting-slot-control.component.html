@if (showsNameCell) {
<div class="col ps-1 pe-0" [ngClass]="className" [title]="tooltip">
  @if (craft.hasCraftingSystemOptions()) {
    <select class="form-control SmallFont border border-secondary" [(ngModel)]="craft.selectedCraftingSystemName" (change)="updateCraftingSystem()"
      [attr.aria-label]="craft.name">
      <option [ngValue]="''">{{emptyLabel(craft)}}</option>
      @for (systemName of craft.craftingSystemOptions; track systemName) {
        <option [ngValue]="systemName">{{systemName}}</option>
      }
    </select>
  } @else {
    {{craft.name}}
  }
</div>
}
@if (!readonly) {
  <div class="d-flex align-items-center" [class.col-8]="showsNameCell" [class.col]="!showsNameCell">
    <!-- One option (nothing but Empty) has nothing to choose between. -->
    @if (visibleOptions.length > 1) {
      <app-crafting-option-picker class="crafting-option-picker"
        [options]="visibleOptions" [selected]="craft.selected" [className]="className"
        [slot]="item.slot" [itemIsEquipped]="itemIsEquipped" [context]="context"
        [compact]="visibleOptions.length < craftingPickerMinOptions"
        (selectedChange)="chooseOption($event)">
      </app-crafting-option-picker>
    }
    @if (getCraftLocations(); as locations) {
      <span class="owned-badge crafting-owned-badge" [title]="locations | userItemLocationTooltip">Owned</span>
    }
  </div>
} @else {
  <!-- The choice as text, underlined when there's more to say about it. -->
  <div class="col-8 readonly-crafting-option" [ngClass]="className" [title]="tooltip">
    <app-affix-name [name]="describe(craft.selected) || 'Empty'" [details]="selectedDetails" [panel]="optionTip" />
    @if (getCraftLocations(); as locations) {
      <span class="owned-badge crafting-owned-badge" [title]="locations | userItemLocationTooltip">Owned</span>
    }
  </div>
}
<app-tap-tooltip-panel #optionTip />

<div class="row section-header">
    <h3>Tracked Affixes</h3>
</div>
<div class="row">
    <div class="col-12 tracked-affix-section" [ngClass]="getAffixGroupClass(group.name)" *ngFor="let group of getTrackedAffixGroups()">
        <button type="button" class="tracked-affix-group-title" (click)="toggleAffixGroup(group.name)"
            [attr.aria-expanded]="!isAffixGroupCollapsed(group.name)">
            <span>{{group.name}}</span>
            <span class="tracked-affix-header-actions">
                <span class="tracked-affix-count" *ngIf="isAffixGroupCollapsed(group.name)">{{getAffixGroupCount(group)}}</span>
                <span class="tracked-affix-collapse-indicator" [class.collapsed]="isAffixGroupCollapsed(group.name)" aria-hidden="true">&#8250;</span>
            </span>
        </button>
        <div class="row" *ngIf="!isAffixGroupCollapsed(group.name)">
            <div class="card col-sm-12 col-md-6 col-lg-4" *ngIf="group.checklistAffixes.length">
                <div>
                    <span class="h5">Checklist Affixes</span>
                </div>
                <div class="col" *ngFor="let affixName of group.checklistAffixes">
                    <button class="w-100" *ngIf="boolAffixMap.get(affixName)[0].value; else noValueBools"
                        (click)="showItemsWithBonusType(affixName, boolAffixMap.get(affixName)[0].bonusType)">
                        <span class="max-value">{{affixName}}</span>
                        <span class="far fa-check-square max-value float-end pt-1"></span>
                    </button>
                    <ng-template #noValueBools>
                        <button [hidden]="boolAffixMap.get(affixName)[0].bonusType === 'Penalty'" class="w-100 no-value"
                            (click)="showItemsWithBonusType(affixName, boolAffixMap.get(affixName)[0].bonusType)">
                            {{affixName}}
                            <span class="far fa-square no-value float-end pt-1"></span>
                        </button>
                    </ng-template>
                </div>
            </div>
            <div class="card col-sm-12 col-md-6 col-lg-4" *ngFor="let affixName of group.affixes">
                <div class="col">
                    <span class="h5">{{affixName}}: {{currentBonus(affixName)}}<span
                            class="max-available">/{{maxBonus(affixName)}}</span></span>
                    <button type="button" class="custom-close float-end" aria-label="Close" (click)="removeAffix(affixName)">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="col" *ngFor="let types of getVisibleTypes(affixName)">
                    <button class="w-100 tracked-bonus-button" *ngIf="types.value; else noValue"
                        (click)="showItemsWithBonusType(getSourceAffixName(affixName, types), getSourceBonusType(types))"
                        [title]="getBonusTypeTooltip(affixName, types)">
                        <span class="tracked-bonus-side" aria-hidden="true"></span>
                        <span class="tracked-bonus-label"
                            [ngClass]="getClassForValue(affixName, types)">
                            {{getBonusTypeLabel(types)}}:
                            {{types.value}}
                        </span>
                        <span class="tracked-bonus-side max-available">
                            <span *ngIf="shouldShowMaxAvailable(affixName, types)">[{{getMaxValueForType(affixName, types)}}]</span>
                        </span>
                    </button>
                    <ng-template #noValue>
                        <button class="w-100 no-value tracked-bonus-button"
                            [title]="getBonusTypeTooltip(affixName, types)"
                            (click)="showItemsWithBonusType(getSourceAffixName(affixName, types), getSourceBonusType(types))">
                            <span class="tracked-bonus-side" aria-hidden="true"></span>
                            <span class="tracked-bonus-label">{{getBonusTypeLabel(types)}}</span>
                            <span class="tracked-bonus-side max-available">
                                <span *ngIf="shouldShowMaxAvailable(affixName, types)">[{{getMaxValueForType(affixName, types)}}]</span>
                            </span>
                        </button>
                    </ng-template>
                </div>
                <div class="tracked-affix-unavailable-types" *ngIf="getUnavailableTypes(affixName).length">
                    Filtered types: {{getUnavailableTypes(affixName).join(', ')}}
                </div>
            </div>
        </div>
    </div>

</div>

<div class="row">
    <a class="btn btn-success col-sm-4 col-md-4 col-lg-2 mt-1 mb-2" routerLink="/affixes" queryParamsHandling="preserve" routerLinkActive="active">Add Affixes...</a>
</div>

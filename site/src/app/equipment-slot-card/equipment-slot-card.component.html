<div class="row slot-header" [class.header-only]="!equipped.hasItem(slot)">
  <button type="button" class="btn btn-secondary slot-select-button text-start col-12"
    [class.has-clear]="equipped.hasItem(slot)"
    [class.has-bonus-button]="equipped.hasItem(slot) && canTakeBonuses()"
    [class.is-empty]="!equipped.hasItem(slot)"
    [disabled]="equipped.isSlotDisabled(slot)"
    [title]="getSlotTitle()"
    (click)="showSuggestedItems()">
    <div class="slot-name-row">
      <span class="slot-name"><app-slot-icon [slot]="slot"></app-slot-icon><span class="slot-name-text">{{label}}</span></span>
      <span class="slot-badges">
        @if (recommendedStart) {
          <span class="equipment-start-badge">Start Here</span>
        }
        @if (userOwnsItem()) {
          <span class="owned-badge"
            [title]="getUserItemLocations() | userItemLocationTooltip">Owned</span>
        }
        @if (isRaid) {
          <span class="loot-badge raid-loot-badge" title="Raid loot">Raid</span>
        }
        @if (isRare) {
          <span class="loot-badge rare-loot-badge" title="Rare loot">Rare</span>
        }
        @if (isArtifact) {
          <span class="loot-badge artifact-loot-badge" title="Minor artifact">Artifact</span>
        }
      </span>
    </div>
    @if (equipped.hasItem(slot)) {
      <div class="item-name" appShrinkToFit>{{itemName}}</div>
    }
  </button>
  @if (equipped.hasItem(slot) && !equipped.isSlotDisabled(slot) && canTakeBonuses()) {
    <button type="button" class="slot-bonus-button"
      [class.is-active]="editingBonuses || hasBonuses"
      [attr.aria-pressed]="editingBonuses"
      aria-label="Mythic, Reaper and Curse bonuses for {{label}}"
      title="Mythic, Reaper and Curse bonuses"
      (mousedown)="preserveScrollOnMouseDown($event)"
      (click)="toggleBonusEditor()">
      <i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i>
    </button>
  }
  @if (equipped.hasItem(slot) && !equipped.isSlotDisabled(slot)) {
    <button type="button" class="icon-x-button icon-x-button-overlay slot-clear-button"
      aria-label="Clear {{label}}"
      title="Clear {{label}}"
      (mousedown)="preserveScrollOnMouseDown($event)"
      (click)="clearSlot()">
      <span class="x-glyph" aria-hidden="true"></span>
    </button>
  }
</div>
<app-gear-description [item]=equipped.getSlot(slot) [showLootBadges]="false" [editBonuses]="editingBonuses"></app-gear-description>
@if (filigreeHost) {
  <app-filigree-slots [host]="filigreeHost"></app-filigree-slots>
}

<!-- Built from the same pieces as an empty gear slot's header (the shared .slot-select-button
     rules in styles.css), so this card matches the gear cards beside it. A div, not a button,
     because the eye tooltip and the add button are buttons of their own; a click anywhere on
     it reaches the add button's handler by bubbling, the eye's stops its own. -->
<div class="row slot-header" [class.header-only]="!entries.length && !adding">
  <div class="btn btn-secondary slot-select-button is-empty external-slot-header text-start col-12" (click)="toggleAdd()">
    <div class="slot-name-row">
      <span class="external-slot-title">
        <span class="slot-name"><app-slot-icon icon="aura"></app-slot-icon><span class="slot-name-text">Non-gear</span></span>
        <app-tap-tooltip [text]="description" label="What is Non-gear?" [panel]="descriptionTip"><i class="fas fa-eye small ms-1" aria-hidden="true"></i></app-tap-tooltip>
      </span>
      <button type="button" class="external-add-button"
        [attr.aria-expanded]="adding"
        [attr.aria-label]="adding ? 'Cancel adding a non-gear affix' : 'Add a non-gear affix'"
        [title]="adding ? 'Cancel' : 'Add a non-gear affix'">
        <span class="fas" [ngClass]="adding ? 'fa-xmark' : 'fa-plus'" aria-hidden="true"></span>
      </button>
    </div>
  </div>
  <app-tap-tooltip-panel #descriptionTip />
</div>
@if (adding) {
  <div class="external-add-panel">
    <app-typeahead placeholder="Search for an affix" [source]="affixSource" [onChange]="onAffixSelected"
      inputClass="form-control-sm" container="body" searchType="external_affix" [autofocus]="true"></app-typeahead>
    @if (selectedAffix) {
      <div class="external-add-selection">
        <span class="external-add-affix" [title]="selectedAffix">{{selectedAffix}}</span>
        <select class="form-select form-select-sm external-add-bonus-type" aria-label="Bonus type"
          [appAutofocus]="!selectedBonusType" [(ngModel)]="selectedBonusType">
          <option value="" disabled>Bonus type</option>
          @for (bonusType of bonusTypes; track bonusType) {
            <option [value]="bonusType">{{bonusType}}</option>
          }
        </select>
      </div>
      @if (selectedBonusType) {
        <app-external-affix-form [affixName]="selectedAffix" [bonusType]="selectedBonusType"
          [autofocus]="true" (done)="closeAdd()"></app-external-affix-form>
      }
    }
  </div>
}
@if (entries.length) {
  <div class="external-affix-list">
    @for (entry of entries; track entry.id) {
      <div class="row table-condensed small hover-helper external-affix-row" [ngClass]="getRowClass(entry)" [title]="getRowTooltip(entry)">
        <button type="button" class="show-on-hover icon-x-button external-affix-remove" aria-label="Remove" (mousedown)="preserveScrollOnMouseDown($event)" (click)="remove(entry.id)">
          <span class="x-glyph" aria-hidden="true"></span>
        </button>
        <div class="col ps-1">{{getNameText(entry)}}
          @if (getGroupTooltip(entry); as groupTooltip) {
            <app-tap-tooltip [text]="groupTooltip" label="Show grouped affix details" [panel]="groupTip">
              <i class="fas fa-eye small ms-1" aria-hidden="true"></i>
            </app-tap-tooltip>
          }
        </div>
        <div class="col-5" [class.external-affix-ignored-value]="entry.kind === 'ignored'"><app-external-affix-value [entry]="entry"></app-external-affix-value></div>
        <app-tap-tooltip-panel #groupTip />
      </div>
    }
  </div>
}

@if (preview.item; as item) {
  <aside class="item-preview-panel" aria-label="Item preview">
    <div class="item-preview-header">
      <div class="item-preview-title">
        <button type="button" class="preview-nav-button" aria-label="Previous item"
          (click)="preview.showPrevious()" [disabled]="!preview.canShowPrevious()">
          &lsaquo;
        </button>
        <h3>{{item.name}}</h3>
        <button type="button" class="preview-nav-button" aria-label="Next item"
          (click)="preview.showNext()" [disabled]="!preview.canShowNext()">
          &rsaquo;
        </button>
      </div>
      <button type="button" class="preview-close" aria-label="Close item preview" (click)="preview.close()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="item-preview-card">
      <app-gear-description
        [item]="item"
        [readonly]="false"
        [equipOnChange]="false"
        [highlightAffixName]="highlightAffixName"
        [highlightBonusType]="highlightBonusType">
      </app-gear-description>
    </div>
    <div class="item-preview-actions">
      <a class="wiki-link" [href]="item.getURL()" target="_blank" rel="noreferrer">
        Open wiki page
      </a>
      <button type="button" class="equip-button preview-equip-button" (click)="equip.emit(item)" [disabled]="!equipped.canEquip(item)">
        Equip
      </button>
    </div>
  </aside>
}

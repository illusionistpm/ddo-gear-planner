<div class="modal-body">
  <div class="col">
    <button type="button" class="custom-close float-end" aria-label="Close" (click)="close()">
      <span aria-hidden="true">&times;</span>
    </button>
    <h1>
      {{slot}} Choices
    </h1>
  </div>

  <div class="row">
    <span>Search by name: </span>
    <input type="text" class="form-control col-8" placeholder="Enter an item name"
      [(ngModel)]="searchQuery" (input)="onSearchQueryChanged()">
  </div>

  <hr>

    <div class="row crafted-items-section">
      <span class="crafted-items-label">Crafted items: </span>
      <div class="crafted-items-list">
      @for (item of essenceCrafting; track item.name) {
        <div class="crafted-item-option">
          <button class="btn btn-primary equip-button crafted-item-button" (click)="equipItem(item)">
            {{item.name}}
            @if (userOwnsItem(item)) {
              <span class="user-owned-star" [title]="getUserItemLocations(item) | userItemLocationTooltip">★</span>
            }
          </button>
        </div>
      }
      </div>
    </div>

    <hr>

      <div class="row">
        <span>Suggested items: </span>
      </div>

      @for (item of gear; track item.name) {
        <div class="container">
          <div class="row">
            <span class="col">{{item.name}}
              @if (userOwnsItem(item)) {
                <span class="user-owned-star" [title]="getUserItemLocations(item) | userItemLocationTooltip">★</span>
              }
            </span>
            <button class="col-2 equip-button" (click)="equipItem(item)">Equip</button>
          </div>
          <div class="row">
            <app-gear-description class="col" [item]=item [readonly]=true></app-gear-description>
          </div>
          <hr>
          </div>
        }
      </div>

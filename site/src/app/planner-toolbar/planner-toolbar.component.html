<div class="planner-view-switch" role="tablist" aria-label="Planner view" #viewSwitch
  [style.--planner-view-index]="isActiveTab('affixes') ? 1 : 0">
  <span class="planner-view-thumb" aria-hidden="true"></span>
  <button type="button" id="equipmentTab" class="planner-view-option" role="tab"
    [class.active]="isActiveTab('equipment')"
    [attr.aria-selected]="isActiveTab('equipment')"
    [attr.tabindex]="isActiveTab('equipment') ? 0 : -1"
    aria-controls="equipmentPanel"
    (click)="selectTab('equipment')"><span class="planner-view-option-full">Equipment</span><span
      class="planner-view-option-short">Gear</span></button>
  <button type="button" id="affixesTab" class="planner-view-option" role="tab"
    [class.active]="isActiveTab('affixes')"
    [attr.aria-selected]="isActiveTab('affixes')"
    [attr.tabindex]="isActiveTab('affixes') ? 0 : -1"
    aria-controls="affixesPanel"
    (click)="selectTab('affixes')"><span class="planner-view-option-full">Tracked Affixes</span><span class="planner-view-option-short">Affixes</span></button>
</div>

<div class="equipment-search" [hidden]="!isActiveTab('equipment')" #gearSearch>
  <i class="fas fa-search equipment-search-icon" aria-hidden="true"></i>
  <app-typeahead id="globalSearch" type="text" placeholder="Search all gear..."
    [source]="getAllGear()" [onChange]="onGlobalItemSelected" [resultFormatter]="globalResultFormatter"
    [inputClass]="'form-control form-control-sm'" searchType="global_item"></app-typeahead>
</div>

<div class="tracked-affix-groupby" role="group" aria-label="Group tracked affixes by"
  [hidden]="!isActiveTab('affixes')">
  <span class="tracked-affix-groupby-label">Group by</span>
  <button type="button" class="tracked-affix-groupby-option" [class.active]="groupMode === 'category'"
    [attr.aria-pressed]="groupMode === 'category'" (click)="setGroupMode('category')">Category</button>
  <button type="button" class="tracked-affix-groupby-option" [class.active]="groupMode === 'slots'"
    [attr.aria-pressed]="groupMode === 'slots'" (click)="setGroupMode('slots')">Scarcity</button>
</div>

<!-- Outside both view controls: what the planner tracks is worth changing from
     either view. Opens and closes the Build Goals editor at the top of the
     Build Goals panel, whose blue accent it shares. One label either way -
     the chevron and aria-expanded say whether it's open. -->
<button type="button" class="tracked-affix-edit-affixes" #editAffixes
  [class.open]="editorOpen"
  [class.needs-attention]="needsAffixes && !editorOpen"
  [attr.aria-expanded]="editorOpen"
  aria-controls="affixEditor"
  [title]="needsAffixes && !editorOpen ? 'Start here: choose your build\'s goals' : 'Show or hide your build goals'"
  (click)="toggleEditor()">
  <span class="tracked-affix-edit-affixes-label">Build Goals</span>
  <span class="tracked-affix-edit-affixes-short">Goals</span>
  <span class="fas fa-chevron-down affix-toggle-chevron" aria-hidden="true"></span>
</button>

<!-- A phone has no room on this line; the build actions' overflow menu carries it there. -->
<button type="button" class="shopping-list-open" title="Shopping list" aria-label="Shopping list" (click)="openShoppingList()">
  <span class="fas fa-cart-shopping" aria-hidden="true"></span>
  <span class="shopping-list-open-label">Shopping list</span>
</button>

<!-- This build is on a list of several builds: the way back to it, and the reminder that it's going. -->
@if (rejoin; as list) {
  <button type="button" class="shopping-list-open shopping-list-rejoin" [title]="'Rejoin ' + list.name + ' (' + list.buildCount + ' builds)'"
    [attr.aria-label]="'Rejoin ' + list.name + ', a shopping list of ' + list.buildCount + ' builds'" (click)="rejoinList(list)">
    <span class="fas fa-people-group" aria-hidden="true"></span>
    <span class="shopping-list-open-label">Rejoin {{list.name}}</span>
    <span class="shopping-list-rejoin-count" aria-hidden="true">{{list.buildCount}}</span>
  </button>
}

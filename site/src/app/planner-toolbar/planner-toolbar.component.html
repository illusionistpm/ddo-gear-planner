<div class="planner-view-switch" role="tablist" aria-label="Planner view" #viewSwitch
  [style.--planner-view-index]="isActiveTab('affixes') ? 1 : 0">
  <span class="planner-view-thumb" aria-hidden="true"></span>
  <button type="button" id="equipmentTab" class="planner-view-option" role="tab"
    [class.active]="isActiveTab('equipment')"
    [attr.aria-selected]="isActiveTab('equipment')"
    [attr.tabindex]="isActiveTab('equipment') ? 0 : -1"
    aria-controls="equipmentPanel"
    (click)="selectTab('equipment')"><span class="planner-view-option-full">Equipment</span><span
      class="planner-view-option-short">Gear</span></button>
  <button type="button" id="affixesTab" class="planner-view-option" role="tab"
    [class.active]="isActiveTab('affixes')"
    [attr.aria-selected]="isActiveTab('affixes')"
    [attr.tabindex]="isActiveTab('affixes') ? 0 : -1"
    aria-controls="affixesPanel"
    (click)="selectTab('affixes')"><span class="planner-view-option-full">Build Goals</span><span class="planner-view-option-short">Goals</span></button>
</div>

<div class="equipment-search" [hidden]="!isActiveTab('equipment')" #gearSearch>
  <i class="fas fa-search equipment-search-icon" aria-hidden="true"></i>
  <app-typeahead id="globalSearch" type="text" placeholder="Search all gear..."
    [source]="getAllGear()" [onChange]="onGlobalItemSelected" [resultFormatter]="globalResultFormatter"
    [inputClass]="'form-control form-control-sm'" searchType="global_item"></app-typeahead>
  <kbd class="equipment-search-kbd" aria-hidden="true" title="Press / to search">/</kbd>
</div>

<!-- Outside both view controls: what the planner tracks is worth changing from
     either view. Opens and closes the Build Goals editor at the top of the
     Build Goals panel, whose blue accent it shares. "+ Goals" on a phone, so it is not
     mistaken for the view switch's Goals tab. One label either way -
     the chevron and aria-expanded say whether it's open. -->
<button type="button" class="tracked-affix-edit-affixes" #editAffixes
  [class.open]="editorOpen"
  [class.needs-attention]="needsAffixes && !editorOpen"
  [attr.aria-expanded]="editorOpen"
  aria-controls="affixEditor"
  [title]="needsAffixes && !editorOpen ? 'Start here: choose your build\'s goals' : 'Show or hide your build goals'"
  (click)="toggleEditor()">
  <span class="fas fa-plus affix-toggle-plus" aria-hidden="true"></span>
  <span class="tracked-affix-edit-affixes-label">Build Goals</span>
  <span class="tracked-affix-edit-affixes-short">Goals</span>
  <span class="fas fa-chevron-down affix-toggle-chevron" aria-hidden="true"></span>
</button>

<!--
  One control for both shopping lists. On its own the build has one, and this
  opens it. On a list of several builds as well, the count says so, and a
  small menu offers either: this build's list, or the way back to the group's.
-->
<div class="shopping-list-wrap">
  <button type="button" class="shopping-list-open" [class.shopping-list-on-group]="rejoin"
    [title]="rejoin ? 'Shopping lists' : 'Shopping list'"
    [attr.aria-label]="rejoin ? 'Shopping lists: this build, or ' + rejoin.name : 'Shopping list'"
    [attr.aria-haspopup]="rejoin ? 'menu' : null"
    [attr.aria-expanded]="rejoin ? cartMenuOpen : null"
    (click)="onCartClick()">
    <span class="fas fa-cart-shopping" aria-hidden="true"></span>
    <span class="shopping-list-open-label">Shopping list</span>
    @if (rejoin; as list) {
      <span class="shopping-list-group-count" aria-hidden="true">{{list.buildCount}}</span>
      <i class="fas fa-chevron-down shopping-list-caret" aria-hidden="true"></i>
    }
  </button>

  @if (cartMenuOpen && rejoin; as list) {
    <div class="shopping-list-menu menu-pop" role="menu" aria-label="Shopping lists">
      <button type="button" class="shopping-list-menu-item" role="menuitem" (click)="openShoppingList()">
        <span class="fas fa-cart-shopping shopping-list-menu-icon" aria-hidden="true"></span>
        <span class="shopping-list-menu-text">
          <span class="shopping-list-menu-title">This build</span>
          <span class="shopping-list-menu-detail">Only this build's gear</span>
        </span>
      </button>
      <button type="button" class="shopping-list-menu-item shopping-list-rejoin" role="menuitem" (click)="rejoinList(list)">
        <span class="fas fa-people-group shopping-list-menu-icon" aria-hidden="true"></span>
        <span class="shopping-list-menu-text">
          <span class="shopping-list-menu-title">{{list.name}}</span>
          <span class="shopping-list-menu-detail">The group's list, {{list.buildCount}} builds</span>
        </span>
      </button>
    </div>
    <app-menu-backdrop label="Close shopping lists" (dismiss)="cartMenuOpen = false"></app-menu-backdrop>
  }
</div>

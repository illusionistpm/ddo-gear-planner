@if (elsewhere; as count) {
  <div class="lists-menu-wrap">
    <button type="button" class="lists-menu-button" [attr.aria-expanded]="open" (click)="toggle()"
      title="Switch between your build's shopping list and your lists of several builds">
      <i class="fas fa-list-check" aria-hidden="true"></i>
      <span>Lists</span>
      <span class="lists-menu-count" aria-hidden="true">{{count}}</span>
    </button>
    @if (open) {
      <div class="share-menu lists-menu" role="menu" aria-label="Your shopping lists">
        @for (entry of entries; track entry.key) {
          <button type="button" role="menuitemradio" class="share-menu-item lists-menu-item"
            [class.current]="entry.current" [class.own]="entry.own" [attr.aria-checked]="entry.current" (click)="go(entry)">
            <i class="fas fa-check lists-menu-check" [class.invisible]="!entry.current" aria-hidden="true"></i>
            <span class="lists-menu-name">{{entry.name}}</span>
            <span class="lists-menu-meta">{{entry.meta}}</span>
          </button>
        }
      </div>
      <app-menu-backdrop (dismiss)="close()"></app-menu-backdrop>
    }
  </div>
}

<div class="tracked-equipment-dock" [class.collapsed]="collapsed">
    <aside class="tracked-equipment-rail" aria-label="Equipped gear">
        <div class="tracked-equipment-header">
            <div class="tracked-equipment-title">
                <span>Equipment</span>
            </div>
            <button type="button" class="tracked-equipment-collapse-toggle"
                [attr.aria-expanded]="!collapsed"
                [title]="collapsed ? 'Show equipment' : 'Hide equipment'"
                (click)="toggle()">
                <span class="fas" [class.fa-chevron-right]="collapsed" [class.fa-chevron-left]="!collapsed" aria-hidden="true"></span>
            </button>
        </div>
        @if (collapsed) {
            <button type="button" class="tracked-equipment-collapsed-button"
                title="Show equipment"
                (click)="toggle()">
                <span class="tracked-equipment-collapsed-label">Equipment</span>
            </button>
        } @else {
            <div class="tracked-equipment-slots">
            @for (entry of getEquippedSlots(); track entry.slot) {
                <div class="tracked-equipment-slot-shell"
                    [class.filled]="entry.item"
                    [class.focused]="focusedSlot === entry.slot"
                    [class.recently-equipped]="isRecentlyEquipped(entry.slot)"
                    [class.disabled]="isSlotDisabled(entry.slot)"
                    (mouseenter)="previewSlot(entry.slot)"
                    (mouseleave)="clearPreviewSlot(entry.slot)">
                    <button type="button" class="tracked-equipment-slot"
                        [disabled]="isSlotDisabled(entry.slot)"
                        (click)="showSuggestedItems(entry.slot)">
                        <span class="tracked-equipment-slot-name">{{entry.slot}}</span>
                        <span class="tracked-equipment-item-name">{{getSidebarItemName(entry.item)}}</span>
                        @if (entry.suppliedCount) {
                            <span class="tracked-equipment-source-count">{{entry.suppliedCount}}</span>
                        } @else {
                            <span class="tracked-equipment-source-count-placeholder" aria-hidden="true"></span>
                        }
                    </button>
                    @if (entry.item && !isSlotDisabled(entry.slot)) {
                        <button type="button" class="tracked-equipment-clear"
                            aria-label="Clear {{entry.slot}}"
                            title="Clear {{entry.slot}}"
                            (click)="clearSlot(entry.slot, $event)">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    }
                </div>
            }
            </div>
        }

    </aside>

    @if (!collapsed && getFocusedItem()) {
        <div class="tracked-equipment-card" role="status">
            <div class="tracked-equipment-card-title">
                <span>{{focusedSlot}}</span>
                <strong>{{getFocusedItem()?.name}}</strong>
            </div>
            <app-gear-description [item]="getFocusedItem()" [readonly]="true" [equipOnChange]="false"></app-gear-description>
        </div>
    }
</div>

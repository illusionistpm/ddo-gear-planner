<input #inputElement type="text" class="form-control {{inputClass}}" 
    (selectItem)="onSelectItemMine($event)" 
    [ngbTypeahead]="search" 
    [inputFormatter]="formatter" 
    [resultFormatter]="resultFormatter || formatter"
    [editable]='false'
    [value]="itemName ? itemName : ''"
    placement='auto'
    [container]="container"
    placeholder="{{placeholder}}"
    [appAutofocus]="autofocus"
    (blur)="noMatches = false"
    />
<!-- ngb-typeahead shows nothing for no results: without this, a typo looks like a search that never ran. -->
<div class="typeahead-empty" role="status">@if (noMatches) {No matches}</div>
